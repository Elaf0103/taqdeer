<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Taqdeer | Logging out…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/taqdeer-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Poppins, sans-serif;
      background: linear-gradient(rgba(6,18,40,0.30), rgba(6,18,40,0.30)),
                  url('../assets/background-website.jpg') center/cover no-repeat fixed;
    }
    .card {
      background: rgba(255,255,255,0.93);
      border-radius: 20px;
      padding: 44px 56px;
      text-align: center;
      box-shadow: 0 28px 72px rgba(0,0,0,0.18);
      max-width: 380px;
      width: 90%;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .icon-ring {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(16,185,129,0.12);
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
    }
    .icon-ring svg { display: block; }
    h3 {
      font-size: 18px;
      font-weight: 700;
      color: #065f46;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-ring">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h3>Logged out successfully</h3>
    <p>Redirecting to home…</p>
  </div>

  <script>
    // Clear all auth + session state
    localStorage.removeItem('taqdeer_token');
    localStorage.removeItem('taqdeer_profile');
    localStorage.removeItem('currentExamId');
    localStorage.removeItem('exam-review-context');

    // Notify backend (stateless — fire-and-forget)
    try { fetch('http://localhost:8000/auth/logout', { method: 'POST' }).catch(() => {}); } catch (_) {}

    // Replace history so back-button cannot return here
    setTimeout(() => {
      window.location.replace('../index.html');
    }, 1500);
  </script>
</body>
</html>
