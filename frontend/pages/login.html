
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taqdeer | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/taqdeer-logo.png" type="image/png">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .error { color: #d9534f; font-size: 12px; margin-top: 6px; display: none; }
        .input.invalid { border-color: #d9534f; }
    </style>
</head>

<body class="bg-frost">

<div class="auth">
    <div class="auth-card glass lift">

        <!-- Logo / Brand -->
        <div style="text-align:center; margin-bottom: 20px;">
            <img src="../assets/taqdeer-logo.png" alt="Taqdeer" class="logo" style="margin: 0 auto 10px;">
            <h2>Taqdeer</h2>
            <p class="muted">AI-Powered Exam Grading Platform</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" action="#" method="POST" novalidate autocomplete="off">

            <!--
              Hidden honeypot fields — browsers (Chrome, Safari, Firefox) target
              the FIRST username/password pair they find in the DOM.  These hidden
              inputs absorb any autofill attempt; the real visible fields below are
              left blank.  They are excluded from tab order and ARIA.
            -->
            <input type="text"     name="_u" autocomplete="username"         tabindex="-1" aria-hidden="true" style="display:none;" value="">
            <input type="password" name="_p" autocomplete="current-password" tabindex="-1" aria-hidden="true" style="display:none;" value="">

            <!-- Email -->
            <div style="margin-bottom: 16px;">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" class="input"
                       placeholder="Enter your email" required
                       autocomplete="off" value="">
                <div id="emailError" class="error" aria-live="polite"></div>
            </div>

            <!-- Password -->
            <div style="margin-bottom: 16px;">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input id="password" name="password" type="password" class="input"
                           placeholder="Enter your password" required minlength="8"
                           autocomplete="new-password" value=""
                           style="padding-right:42px;">
                    <button type="button" id="togglePassword" aria-label="Toggle password visibility"
                            style="position:absolute; right:0; top:0; bottom:0; width:40px;
                                   background:none; border:none; cursor:pointer; display:flex;
                                   align-items:center; justify-content:center; color:var(--text-muted);
                                   transition:color .15s;"
                            onmouseover="this.style.color='var(--c-arctic)'"
                            onmouseout="this.style.color='var(--text-muted)'">
                        <!-- eye icon (shown when password is hidden) -->
                        <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <!-- eye-off icon (shown when password is visible) -->
                        <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <div id="passwordError" class="error" aria-live="polite"></div>
            </div>

            <!-- Remember me -->
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
                <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="./reset-password.html" class="small">Forgot password?</a>
            </div>

            <!-- General API error (wrong credentials, server unreachable) -->
            <div id="loginError" class="error" aria-live="polite"
                 style="margin-bottom:12px; font-size:13px;"></div>

            <!-- Button -->
            <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;">
                Login
            </button>

        </form>

        <p style="text-align:center; margin-top:18px; font-size:13px; color:var(--text-muted);">
            Don't have an account?
            <a href="./register.html"
               style="color:var(--c-arctic); font-weight:600; text-decoration:none; margin-left:3px;"
               onmouseover="this.style.textDecoration='underline'"
               onmouseout="this.style.textDecoration='none'">Sign up</a>
        </p>

        <script>
            (function(){
                const API_BASE = window.location.hostname.includes('ngrok')
                    ? 'https://YOUR-NGROK-BACKEND-URL.ngrok-free.app'
                    : 'http://localhost:8000';
                console.log('[API]', API_BASE);
                const form         = document.getElementById('loginForm');
                const emailEl      = document.getElementById('email');
                const passwordEl   = document.getElementById('password');
                const emailError   = document.getElementById('emailError');
                const passwordError= document.getElementById('passwordError');
                const loginError   = document.getElementById('loginError');
                const loginBtn     = document.getElementById('loginBtn');

                // Belt-and-suspenders: clear both fields on every page load so
                // no previously typed value survives a back-navigation or redirect.
                // The timeout gives browsers a chance to inject autofill first,
                // then we immediately wipe it out.
                emailEl.value    = '';
                passwordEl.value = '';
                setTimeout(function () {
                    emailEl.value    = '';
                    passwordEl.value = '';
                }, 0);

                // Show flash message set by apiFetch/authGuard when redirecting here after 401
                (function() {
                    var authMsg = sessionStorage.getItem('taqdeer_auth_msg');
                    if (authMsg) {
                        sessionStorage.removeItem('taqdeer_auth_msg');
                        loginError.textContent = authMsg;
                        loginError.style.display = 'block';
                    }
                })();

                function validateEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

                function showFieldError(el, errEl, msg){
                    errEl.textContent = msg;
                    errEl.style.display = 'block';
                    el.classList.add('invalid');
                }
                function clearFieldError(el, errEl){
                    errEl.textContent = '';
                    errEl.style.display = 'none';
                    el.classList.remove('invalid');
                }
                function showLoginError(msg){
                    loginError.textContent = msg;
                    loginError.style.display = 'block';
                }
                function clearLoginError(){
                    loginError.textContent = '';
                    loginError.style.display = 'none';
                }

                // ── Password visibility toggle ───────────────────────────────
                document.getElementById('togglePassword').addEventListener('click', function(){
                    const isHidden = passwordEl.type === 'password';
                    passwordEl.type = isHidden ? 'text' : 'password';
                    document.getElementById('iconEye').style.display    = isHidden ? 'none'  : '';
                    document.getElementById('iconEyeOff').style.display = isHidden ? ''      : 'none';
                });

                emailEl.addEventListener('input',    () => clearFieldError(emailEl,    emailError));
                passwordEl.addEventListener('input', () => clearFieldError(passwordEl, passwordError));

                form.addEventListener('submit', async function(e){
                    e.preventDefault();
                    clearLoginError();

                    // ── Client-side validation ───────────────────────────────
                    let ok = true;
                    const emailVal = emailEl.value.trim();
                    const passVal  = passwordEl.value;

                    if(!emailVal){
                        showFieldError(emailEl, emailError, 'Email is required.');
                        ok = false;
                    } else if(!validateEmail(emailVal)){
                        showFieldError(emailEl, emailError, 'Please enter a valid email address.');
                        ok = false;
                    }

                    if(!passVal){
                        showFieldError(passwordEl, passwordError, 'Password is required.');
                        ok = false;
                    } else if(passVal.length < 8){
                        showFieldError(passwordEl, passwordError, 'Password must be at least 8 characters.');
                        ok = false;
                    }

                    if(!ok) return;

                    // ── Call backend ─────────────────────────────────────────
                    loginBtn.disabled    = true;
                    loginBtn.textContent = 'Signing in…';

                    try {
                        const res = await fetch(API_BASE + '/auth/login', {
                            method:  'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body:    JSON.stringify({ email: emailVal, password: passVal }),
                        });

                        const data = await res.json();

                        if(!res.ok){
                            if(res.status === 403){
                                // Account deactivated — surface the exact backend message
                                showLoginError(
                                    data.detail ||
                                    'Your account has been deactivated. Please contact the administrator.'
                                );
                            } else {
                                showLoginError(data.detail || 'Login failed. Please try again.');
                            }
                            return;
                        }

                        // ── Store token + user profile ──────────────────────
                        // avatarPath is embedded in data.user and served by the backend;
                        // no separate avatar key in localStorage is needed.
                        localStorage.setItem('taqdeer_token',   data.accessToken);
                        localStorage.setItem('taqdeer_profile', JSON.stringify(data.user));

                        // ── Role-based redirect ──────────────────────────────
                        if(data.user.role === 'admin'){
                            window.location.href = './admin-dashborad.html';
                        } else {
                            window.location.href = './dashboard.html';
                        }

                    } catch(err) {
                        showLoginError('Could not reach the server. Please check your connection.');
                    } finally {
                        loginBtn.disabled    = false;
                        loginBtn.textContent = 'Login';
                    }
                });
            })();
        </script>

    </div>
</div>

</body>
</html>
