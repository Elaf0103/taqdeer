<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taqdeer | Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/taqdeer-logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-frost">

<div class="auth">
    <div class="auth-card glass lift">

        <!-- Logo -->
        <div style="text-align:center; margin-bottom:24px;">
            <img src="../assets/taqdeer-logo.png" alt="Taqdeer" class="logo" style="margin:0 auto 10px;">
            <h2>Forgot Password?</h2>
            <p class="muted" style="font-size:0.88rem; line-height:1.5; max-width:300px; margin:0 auto;">
                Enter the email address linked to your account and we'll send you a reset link.
            </p>
        </div>

        <!-- Alert (errors) -->
        <div id="alertBox" style="display:none; background:rgba(220,38,38,0.08); border:1px solid rgba(220,38,38,0.28);
             border-radius:10px; padding:10px 14px; margin-bottom:14px; color:#b91c1c; font-size:0.85rem;"></div>

        <!-- Form -->
        <div id="formSection">
            <div style="margin-bottom:18px;">
                <label for="emailInput">Email Address</label>
                <input id="emailInput" type="email" class="input"
                       placeholder="Enter your registered email"
                       autocomplete="email">
            </div>

            <button id="sendBtn" type="button" class="btn btn-primary" style="width:100%;">
                <span id="sendText">Send Reset Link</span>
                <span id="sendSpinner" style="display:none; font-size:0.9rem;">&#8987;</span>
            </button>

            <p class="small" style="text-align:center; margin-top:16px;">
                <a href="./login.html"
                   style="color:var(--c-arctic); text-decoration:none; font-weight:500;"
                   onmouseover="this.style.textDecoration='underline'"
                   onmouseout="this.style.textDecoration='none'">
                    &larr; Back to Login
                </a>
            </p>
        </div>

        <!-- Success state (shown after submit) -->
        <div id="successSection" style="display:none; text-align:center; padding:8px 0;">
            <!-- Mail icon -->
            <div style="width:56px; height:56px; margin:0 auto 16px; border-radius:50%;
                        background:rgba(4,120,87,0.10); display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#047857"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
            </div>

            <h3 style="margin:0 0 8px; color:var(--c-midnight); font-size:1.1rem;">Check your inbox</h3>
            <p class="muted" style="font-size:0.88rem; line-height:1.6; margin-bottom:22px;">
                If an account with that email exists, we've sent a reset link.
                It expires in <strong>20 minutes</strong>.<br>
                Don't forget to check your spam folder.
            </p>

            <a href="./login.html" class="btn btn-primary"
               style="display:inline-block; text-decoration:none;">
                Back to Login
            </a>
        </div>

    </div>
</div>

<script>
(function () {
    const API_BASE = window.location.hostname.includes('ngrok')
        ? 'https://YOUR-NGROK-BACKEND-URL.ngrok-free.app'
        : 'http://localhost:8000';

    const alertBox      = document.getElementById('alertBox');
    const formSection   = document.getElementById('formSection');
    const successSection= document.getElementById('successSection');
    const emailInput    = document.getElementById('emailInput');
    const sendBtn       = document.getElementById('sendBtn');
    const sendText      = document.getElementById('sendText');
    const sendSpinner   = document.getElementById('sendSpinner');

    function showAlert(msg) {
        alertBox.textContent   = msg;
        alertBox.style.display = 'block';
    }
    function hideAlert() {
        alertBox.style.display = 'none';
    }

    async function submit() {
        hideAlert();

        const email = emailInput.value.trim();
        if (!email) {
            showAlert('Please enter your email address.');
            return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showAlert('Please enter a valid email address.');
            return;
        }

        sendBtn.disabled           = true;
        sendText.textContent       = 'Sending\u2026';
        sendSpinner.style.display  = 'inline';

        try {
            const res = await fetch(API_BASE + '/auth/forgot-password', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email }),
            });

            // Always show the neutral success message regardless of response body.
            // The backend never reveals whether the email exists.
            if (res.ok || res.status === 200) {
                formSection.style.display    = 'none';
                successSection.style.display = '';
            } else {
                const data = await res.json().catch(() => ({}));
                showAlert(data.detail || 'Something went wrong. Please try again.');
            }
        } catch {
            showAlert('Could not reach the server. Please check your connection.');
        } finally {
            sendBtn.disabled          = false;
            sendText.textContent      = 'Send Reset Link';
            sendSpinner.style.display = 'none';
        }
    }

    sendBtn.addEventListener('click', submit);
    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
})();
</script>

</body>
</html>
